name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Demo, and a real check of the CI machine (read-only)
        run: |
          cargo run --quiet -- demo --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'bad' and d['counts']['warn'] == 4"
          cargo run --quiet -- check --no-color
          cargo run --quiet -- --save /tmp/hestia.json -q && test "$(stat -c %a /tmp/hestia.json)" = 600

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
