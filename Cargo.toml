[package]
name = "hestia"
version = "0.3.0"
edition = "2021"
description = "Health check for a Linux laptop: disks, temperatures, battery wear, memory, load, failed services"
license = "MIT"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = 3
